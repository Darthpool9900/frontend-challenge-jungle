<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#150d0a" />
    <meta name="description" content="Kurio — marketplace de NFTs e arte digital. Explore coleções, conecte sua carteira e colecione." />
    <!-- A mesma família Roboto/Roboto Mono, carregada sem bloquear o primeiro paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="kurio-fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&amp;family=Roboto+Mono:wght@400;500;600;700;800&amp;display=swap"
      media="print"
      onload="this.onload=null;this.media='all'"
      onerror="this.dataset.failed='true'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&amp;family=Roboto+Mono:wght@400;500;600;700;800&amp;display=swap"
      />
    </noscript>
    <!-- Only preload the artwork that is actually above the fold on this route. -->
    <script>
      (() => {
        const path = window.location.pathname;
        let artwork;

        if (path === "/" && !window.location.search) {
          artwork = window.matchMedia("(max-width: 700px)").matches
            ? "/kurio/sage.webp"
            : "/kurio/emerald.webp";
        } else {
          const match = /^\/nft\/nft-(\d+)$/.exec(path);

          if (match) {
            const number = Number(match[1]);
            let index;

            if (number >= 7 && number <= 9) index = 3;
            else if (number <= 1) index = 0;
            else if (number === 2 || number === 4 || number === 5) index = 1;
            else if (number === 3 || number === 6) index = 2;
            else if (number % 4 === 0) index = 1;
            else if (number % 4 === 1) index = 0;
            else if (number % 4 === 2) index = 2;
            else index = 3;

            artwork = [
              "/kurio/emerald.webp",
              "/kurio/sage.webp",
              "/kurio/ivory.webp",
              "/kurio/golden.webp",
            ][index];
          }
        }

        if (artwork) {
          const preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "image";
          preload.href = artwork;
          preload.fetchPriority = "high";
          document.head.appendChild(preload);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/kurio/icon.svg" />
    <title>Kurio — Arte digital e NFTs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
